<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - BGFLIX</title>

<link rel="stylesheet" href="style.css">

<style>
.page-section{
padding:140px 8% 80px;
min-height:100vh;
background:#000;
}

.contact-card{
max-width:900px;
margin:auto;
background:#111;
padding:50px;
border-radius:20px;
border:1px solid #222;
}

.contact-card h1{
font-size:3rem;
margin-bottom:15px;
color:#e50914;
}

.contact-card p{
color:#ccc;
margin-bottom:25px;
}

.contact-form{
display:flex;
flex-direction:column;
gap:20px;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:15px;
background:#1a1a1a;
border:1px solid #333;
border-radius:10px;
color:#fff;
font-size:1rem;
}

.contact-form textarea{
min-height:180px;
resize:vertical;
}

.contact-form button{
background:#e50914;
border:none;
padding:15px;
border-radius:10px;
color:white;
font-size:1rem;
font-weight:700;
cursor:pointer;
}

.contact-form button:hover{
opacity:.9;
}

.contact-info{
margin-top:40px;
padding-top:30px;
border-top:1px solid #222;
}

.contact-info h3{
margin-bottom:15px;
}

.contact-info p{
margin-bottom:10px;
}

.back-btn{
display:inline-block;
margin-top:30px;
padding:12px 25px;
background:#e50914;
color:#fff;
text-decoration:none;
border-radius:8px;
font-weight:600;
}
</style>
</head>

<body>

<nav class="navbar">
<div class="logo">
<a href="index.html" style="text-decoration:none;color:#e50914;">
BGFLIX
</a>
<span class="logo-sub">by Sharma Group</span>
</div>

<div class="nav-buttons">
<a href="index.html" class="hero-btn">Home</a>
</div>
</nav>

<section class="page-section">

<div class="contact-card">

<h1>Contact Us</h1>

<p>
Have questions, suggestions, or feedback? We'd love to hear from you.
</p>

<form class="contact-form">

<input
type="text"
placeholder="Your Name"
required
>

<input
type="email"
placeholder="Your Email"
required
>

<textarea
placeholder="Your Message"
required
></textarea>

<button type="submit">
Send Message
</button>

</form>

<div class="contact-info">

<h3>BGFLIX Support</h3>

<p>
Email:
<a href="mailto:sharmagroup2026business@gmail.com">
sharmagroup2026business@gmail.com
</a>
</p>

<p>Response Time: Within 24–48 hours</p>

</div>

<a href="index.html" class="back-btn">
Back to Home
</a>

</div>

</section>

</body>
</html>
